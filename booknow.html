<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Now - JEWELUX</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #410101, #e0e0e0);
    margin: 0;
}

nav {
    background: black;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    letter-spacing: 2px;
}

.container {
    max-width: 500px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #000000;
    font-size: 14px;
}

input:focus, select:focus {
    outline: none;
    border-color: rgb(121, 14, 14);
}

button {
    width: 100%;
    padding: 14px;
    background: black;
    color: rgb(252, 240, 240);
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #333;
}

.payment {
    margin: 15px 0;
}

.payment label {
    margin-right: 10px;
}

#upiBox {
    display: none;
    text-align: center;
    margin-top: 15px;
}
</style>

</head>

<body>

<nav>
    <h1>JEWELUX</h1>
</nav>

<div class="container">
    <h2>Book Your Jewelry 💎</h2>

    <form>

        <input type="text" placeholder="Name" required>
        <input type="tel" placeholder="Phone Number" required>

        <!-- ✅ PRODUCT SELECT -->
        <select id="product" required>
            <option value="">Select Product</option>
            <option value="Diamond Ring 💍">Diamond Ring 💍</option>
            <option value="Gold Necklace ✨">Gold Necklace ✨</option>
            <option value="Silver Bracelet 🔗">Silver Bracelet 🔗</option>
            <option value="Luxury Watch ⌚">Luxury Watch ⌚</option>
            <option value="Pearl Earrings 🤍">Pearl Earrings 🤍</option>
            <option value="Gold Chain 🟡">Gold Chain 🟡</option>
        </select>

        <input type="text" placeholder="Address" required>

        <!-- State -->
        <select id="state" required>
            <option value="">Select State</option>
        </select>

        <!-- District -->
        <select id="district" required>
            <option value="">Select District</option>
        </select>

        <!-- Payment -->
        <div class="payment">
            <p><b>Payment:</b></p>
            <input type="radio" name="pay" id="cod" required>
            <label for="cod">COD</label>

            <input type="radio" name="pay" id="upi">
            <label for="upi">UPI</label>
        </div>

        <!-- UPI QR -->
        <div id="upiBox">
            <p>Scan to Pay</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=yourupi@upi&pn=JEWELUX">
        </div>

        <button type="submit">Confirm Order</button>

    </form>
</div>

<script>
// ✅ URL se product auto select (optional)
const params = new URLSearchParams(window.location.search);
const selectedProduct = params.get("product");

if(selectedProduct){
    document.getElementById("product").value = selectedProduct;
}

// ✅ State + District Data
const data = {
"Manipur": ["Imphal West","Imphal East","Thoubal","Churachandpur"],
"Assam": ["Guwahati","Dibrugarh","Silchar"],
"Delhi": ["New Delhi","North Delhi","South Delhi"],
"Maharashtra": ["Mumbai","Pune","Nagpur"],
"Uttar Pradesh": ["Lucknow","Kanpur","Varanasi"],
"West Bengal": ["Kolkata","Siliguri"],
"Tamil Nadu": ["Chennai","Madurai","Coimbatore"],
"Karnataka": ["Bangalore","Mysore"],
"Rajasthan": ["Jaipur","Udaipur"],
"Bihar": ["Patna","Gaya"]
};

// Load states
let stateSelect = document.getElementById("state");
for (let state in data) {
    stateSelect.innerHTML += `<option value="${state}">${state}</option>`;
}

// Change districts
stateSelect.addEventListener("change", function() {
    let district = document.getElementById("district");
    district.innerHTML = "<option value=''>Select District</option>";

    data[this.value].forEach(d => {
        district.innerHTML += `<option value="${d}">${d}</option>`;
    });
});

// 💰 Show UPI QR
document.querySelectorAll("input[name='pay']").forEach(el => {
    el.addEventListener("change", function() {
        if(this.id === "upi"){
            document.getElementById("upiBox").style.display = "block";
        } else {
            document.getElementById("upiBox").style.display = "none";
        }
    });
});
</script>

</body>
</html>
