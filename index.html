<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEWELUX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

body {
    background: linear-gradient(135deg, #1a0000, #1d0000);
    color: white;
}

/* NAVBAR */
nav {
    display:flex;
    justify-content:space-between;
    padding:20px 60px;
    background: linear-gradient(135deg, #1a0000, #1d0000);
    border-bottom:1px solid gold;
    align-items:center;
}

nav h1 { color:gold; }

nav ul {
    display:flex;
    gap:25px;
    list-style:none;
    align-items:center;
}

nav a {
    color:white;
    text-decoration:none;
    padding:6px 12px;
    border-radius:6px;
    transition:0.3s;
}

/* Hover */
nav a:hover {
    background:gold;
    color:black;
}

/* ACTIVE PAGE */
nav a.active {
    background:gold;
    color:black;
    font-weight:bold;
}

/* 🔥 LOGIN BUTTON */
.login-btn {
    background:gold;
    color:black;
    padding:6px 15px;
    border-radius:20px;
    font-weight:500;
}

.login-btn:hover {
    background:white;
    color:black;
}

.cart-top { color:gold; cursor:pointer; }

/* HERO */
.hero {
    height:90vh;
    background:url('https://images.unsplash.com/photo-1611652022419-a9419f74343d') center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
}

.hero h2 {
    font-size:55px;
    background:rgba(0,0,0,0.6);
    padding:20px;
    border:1px solid gold;
}

/* PRODUCTS */
.products { padding:60px; text-align:center; }

.product-grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
}

.card {
    background:rgba(255,255,255,0.05);
    border-radius:15px;
    padding-bottom:20px;
}

.card img {
    width:100%;
    height:250px;
    object-fit:cover;
}

button {
    padding:10px 15px;
    border:none;
    margin:5px;
    cursor:pointer;
    border-radius:5px;
}

.cart-btn { background:white; color:rgb(27, 4, 4); }
.buy-btn { background:gold; }

/* FOOTER */
footer {
    text-align:center;
    padding:20px;
    background:rgb(29, 0, 0);
}
</style>
</head>

<body>

<nav>
<h1>JEWELUX</h1>

<ul>
<li><a href="index.html" class="active">Home</a></li>
<li><a href="products.html">Products</a></li>
<li><a href="about.html">About</a></li>

<li onclick="goToCart()" class="cart-top">🛒 (<span id="cart-count">0</span>)</li>

<!-- ✅ LOGIN BUTTON -->
<li><a href="login.html" class="login-btn">Login</a></li>
</ul>
</nav>

<section class="hero">
<h2>Luxury Jewellery Collection</h2>
</section>

<section class="products">
<h2>Our Premium Collection</h2>

<div class="product-grid">

<div class="card">
<img src="https://d25g9z9s77rn4i.cloudfront.net/uploads/product/194/1737539642_bdac2baf411a5259c0b3.jpg">
<h3>Gold Necklace</h3>
<h4>$999</h4>

<button class="cart-btn" onclick="addToCart('Gold Necklace')">Add to Cart</button>
<button class="buy-btn" onclick="window.location.href='booknow.html'">Book Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=800&q=80">
<h3>Diamond Ring</h3>
<h4>$549</h4>

<button class="cart-btn" onclick="addToCart('Diamond Ring')">Add to Cart</button>
<button class="buy-btn" onclick="window.location.href='booknow.html'">Book Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1617038220319-276d3cfab638?auto=format&fit=crop&w=800&q=80">
<h3>Luxury Earrings</h3>
<h4>$649</h4>

<button class="cart-btn" onclick="addToCart('Luxury Earrings')">Add to Cart</button>
<button class="buy-btn" onclick="window.location.href='booknow.html'">Book Now</button>
</div>

</div>
</section>

<footer>
© 2026 JEWELUX
</footer>

<script>
function addToCart(product) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.push(product);
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();
}

function updateCartCount() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    document.getElementById("cart-count").innerText = cart.length;
}

function goToCart() {
    window.location.href = "cart.html";
}

updateCartCount();
</script>

</body>
</html>
